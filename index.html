<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miikun Intelligence</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@2.1.0?external=three"
        }
      }
    </script>
</head>
<body class="bg-[#FAFAFA] overflow-hidden text-slate-900 h-screen w-screen">

    <!-- Subject Selector -->
    <div class="absolute top-8 left-8 z-20 flex flex-col gap-2">
        <select id="subject-selector" class="bg-white/40 backdrop-blur-md border border-white/20 rounded-xl px-4 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-400/50 transition-all appearance-none cursor-pointer">
            <option value="general">放課後 (General)</option>
            <option value="japanese">国語 (Japanese)</option>
            <option value="math">数学 (Math)</option>
            <option value="science">理科 (Science)</option>
            <option value="social">社会 (Social)</option>
            <option value="gs">GS (English)</option>
            <option value="pe">保体 (PE)</option>
            <option value="tech">技術 (Tech)</option>
            <option value="home">家庭科 (Home)</option>
            <option value="moral">道徳 (Moral)</option>
            <option value="career">進路選択 (Career)</option>
        </select>
        <div id="subject-badge" class="px-3 py-1 bg-blue-500/10 text-blue-600 rounded-full text-[10px] font-bold tracking-widest uppercase self-start pointer-events-none">CLASS: GENERAL</div>
    </div>

    <!-- 3D Canvas Layer -->
    <canvas id="miikun-canvas" class="absolute inset-0 w-full h-full -z-10"></canvas>

    <!-- Glassmorphic Chat Log Layer -->
    <div id="chat-container" class="absolute right-0 top-0 w-[35%] h-full overflow-y-auto px-12 pt-40 pb-64 no-scrollbar flex flex-col justify-end pointer-events-none">
        <!-- Messages will be appended here -->
    </div>

    <!-- UI Layer -->
    <div class="absolute bottom-16 left-1/2 -translate-x-1/2 flex flex-col items-center z-10">
        <!-- Waveform Indicator -->
        <div id="waveform" class="flex gap-1 h-6 mb-8 opacity-10 transition-all duration-300">
            <div class="w-1 bg-slate-400 rounded-full h-full animate-wave-1"></div>
            <div class="w-1 bg-slate-400 rounded-full h-3/4 animate-wave-2"></div>
            <div class="w-1 bg-slate-400 rounded-full h-1/2 animate-wave-3"></div>
            <div class="w-1 bg-slate-400 rounded-full h-3/4 animate-wave-2"></div>
            <div class="w-1 bg-slate-400 rounded-full h-full animate-wave-1"></div>
        </div>

        <!-- Mic Button -->
        <button id="mic-button" class="group relative w-20 h-20 rounded-full bg-white/80 backdrop-blur-xl border border-white/40 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] transition-all duration-300 hover:scale-110 active:scale-95 flex items-center justify-center">
            <div id="mic-ring" class="absolute inset-0 rounded-full border-4 border-blue-400/0 transition-all duration-300"></div>
            <svg id="mic-icon" class="w-10 h-10 text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
        </button>

        <div id="loading-indicator" class="mt-4 flex items-center gap-2 opacity-0 transition-opacity">
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
        </div>
        <p id="status-text" class="mt-4 text-xs font-medium text-slate-400 tracking-widest uppercase opacity-0 transition-opacity">Listening...</p>
    </div>

    <!-- License / Attribution -->
    <div class="absolute bottom-4 right-6 text-[10px] text-slate-400/20 hover:text-slate-400/80 transition-colors duration-300 select-none">
        VOICEVOX: 栗田まろん | AI Powered by Miikun Core
    </div>

    <!-- Privacy Consent Modal -->
    <div id="consent-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-md hidden">
        <div class="bg-white/95 p-8 rounded-3xl shadow-2xl max-w-md border border-white/20">
            <h2 class="text-xl font-bold mb-4 text-slate-800">みーくんからのお願い 🎒</h2>
            <div class="space-y-4 text-slate-600 leading-relaxed text-sm">
                <p>
                    ボクと一緒に勉強してくれてありがとう！<br>
                    ボクがもっと賢くなってキミをサポートできるように、**ボクたちの会話の内容は自動的にボクの学習データとして使わせてもらうね。**
                </p>
                <p>
                    利用を続けることで、この内容に同意したものとするよ。<br>
                    （個人を特定できるような名前などは、学習の前にボクたちがしっかりチェックして除外するから安心してね！）
                </p>
            </div>
            <button id="consent-btn" class="mt-8 w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-2xl transition-all shadow-lg active:scale-95">
                わかったよ、同意する！
            </button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
